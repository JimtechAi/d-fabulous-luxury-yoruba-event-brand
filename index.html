<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Google tag (gtag.js) is initialized here, synchronously in the document
      head, rather than being injected by React after mount. This is required
      for Tag Assistant / GA4 to reliably detect the config command and avoid
      "deferred hits" (a config command executed too late for the tag to be
      considered active on initial page load). The measurement ID is injected
      at build time via Vite's HTML env-variable replacement
      (https://vite.dev/guide/env-and-mode.html#html-env-replacement) from the
      existing VITE_GA_MEASUREMENT_ID variable; it is intentionally public
      client-side configuration, not a secret. If the variable is unset (e.g.
      local development without analytics configured), gtag is never defined
      and no network request is made.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      (function () {
        var GA_MEASUREMENT_ID = '%VITE_GA_MEASUREMENT_ID%';
        if (!GA_MEASUREMENT_ID) return;
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        // send_page_view is disabled because this is a client-routed SPA:
        // page_view events are dispatched explicitly per route by
        // src/components/Analytics.tsx to avoid duplicates and to include
        // the correct title/path for the destination route.
        gtag('config', GA_MEASUREMENT_ID, { anonymize_ip: true, send_page_view: false });
      })();
    </script>
    <title>D’Fabulous | Luxury Yoruba Event Personality & Cultural Host</title>
    <meta name="description" content="UK-based luxury event personality and cultural host for Nigerian and Yoruba traditional engagements, weddings, private events, and destination celebrations." />
    <meta property="og:title" content="D’Fabulous | Luxury Yoruba Event Personality & Cultural Host" />
    <meta property="og:description" content="Luxury Yoruba ceremonial hosting, cultural leadership, and wedding reception direction across the UK and internationally." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/hero/hero1.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/favicon/apple-touch-icon.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-ivory-warm text-black-rich font-sans antialiased selection:bg-gold-luxury selection:text-black-rich">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
